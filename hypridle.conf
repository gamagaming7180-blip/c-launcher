# hypridle: staged power saving. Idle times are in seconds.
#
# NOTE: with the Lua config, `hyprctl dispatch` takes a Lua expression. The old
# `hyprctl dispatch dpms off` form is a syntax error there, so the screen never
# switched off and never woke up properly after sleep. Fixed below.
general {
    lock_cmd = pidof hyprlock || hyprlock -c $HOME/.config/hypr-rice/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 2.5 min: dim the screen
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: screen off
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 15 min: suspend
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
