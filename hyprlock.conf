# hyprlock: blurred wallpaper, big clock, minimal input pill. Catppuccin Mocha.
general {
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /home/gama/Pictures/Wallpapers/17c438c1d2b5c23b3dedd384a513b8b1.jpg
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = cmd[update:30000] echo "$(date +'%H:%M')"
    color = rgba(205, 214, 244, 1.0)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(239, 159, 175, 1.0)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(239, 159, 175, 0.9)
    inner_color = rgba(30, 30, 46, 0.8)
    font_color = rgb(205, 214, 244)
    fade_on_empty = true
    placeholder_text = <span foreground="##a6adc8">  Password</span>
    check_color = rgb(166, 227, 161)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL</i>
    rounding = 27
    position = 0, -40
    halign = center
    valign = center
}
