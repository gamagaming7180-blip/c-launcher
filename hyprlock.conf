# hyprlock: Vesper. Blurred wallpaper, glass card, big clock, accent input pill.
# Generated by wallcolors.py from templates/hyprlock.conf.tpl.
general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = /home/gama/Pictures/Wallpapers/.jpg
    blur_passes = 3
    blur_size = 7
    noise = 0.015
    contrast = 0.95
    brightness = 0.50
    vibrancy = 0.22
    vibrancy_darkness = 0.1
}

# glass card behind the clock
shape {
    monitor =
    size = 560, 300
    color = rgba(26, 20, 13, 0.38)
    rounding = 44
    border_size = 1
    border_color = rgba(239, 207, 159, 0.35)
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:20000] echo "$(date +'%H:%M')"
    color = rgba(244, 239, 230, 1.0)
    font_size = 118
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A  ·  %d %B')"
    color = rgba(239, 207, 159, 1.0)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, 52
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgba(192, 181, 165, 0.9)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 8
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgba(239, 207, 159, 0.85)
    inner_color = rgba(10, 8, 6, 0.78)
    font_color = rgba(244, 239, 230, 1.0)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##c0b5a5">  Password</span>
    check_color = rgba(143, 227, 168, 1.0)
    fail_color = rgba(255, 125, 150, 1.0)
    capslock_color = rgba(245, 213, 138, 1.0)
    fail_text = <i>$FAIL</i>
    rounding = 28
    position = 0, -120
    halign = center
    valign = center
}
