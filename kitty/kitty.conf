# kitty: Vesper. Colours live in colors.conf (rewritten by scripts/wallcolors.py; kitty reloads on SIGUSR1).
include colors.conf

font_family      JetBrainsMono Nerd Font
font_size        12.0
window_padding_width 14
background_opacity 0.86
dynamic_background_opacity yes
confirm_os_window_close 0
enable_audio_bell no
scrollback_lines 8000
hide_window_decorations yes

# cursor: block with a short comet trail (only redraws while the cursor moves)
cursor_shape block
cursor_blink_interval 0
cursor_trail 160
cursor_trail_decay 0.08 0.35
cursor_trail_start_threshold 2

# tabs: slim pill-ish bar, only shown with 2+ tabs
tab_bar_style powerline
tab_powerline_style round
tab_bar_min_tabs 2

# lower input latency, fewer CPU wake-ups
repaint_delay 8
input_delay 2
sync_to_monitor yes

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
